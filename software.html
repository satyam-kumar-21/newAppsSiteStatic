<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index page hai ye</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <section class="main">
      <!-- header -->
      <section class="header">
        <div class="container-fluid px-0">
          <div class="row no-gutters m-0">
            <div class="col-md-12 p-0">
              <header class="navbar-wrapper">
                <!-- Logo -->
                <a href="/index.html" class="logo">
                  <!-- <img src="logo.png" alt="Logo" class="logo-img" /> -->
                  <span class="logo-text"
                    >BRAND<span class="highlight">NAME</span></span
                  >
                </a>

                <button
                  class="menu-toggle"
                  type="button"
                  aria-label="Open navigation menu"
                  aria-expanded="false"
                  aria-controls="primary-navigation"
                >
                  <svg
                    class="menu-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                  </svg>
                  <svg
                    class="close-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="m6 6 12 12M18 6 6 18"></path>
                  </svg>
                </button>

                <!-- Navigation Links (Only Apps and Games) -->
                <nav class="nav-menu" id="primary-navigation">
                  <button
                    class="menu-close"
                    type="button"
                    aria-label="Close navigation menu"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      aria-hidden="true"
                    >
                      <path d="m6 6 12 12M18 6 6 18"></path>
                    </svg>
                  </button>
                  <a href="/apps.html" class="nav-item">
                    <!-- Grid/Apps Icon -->
                    <svg
                      class="nav-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                      <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                      <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                      <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                    Apps
                  </a>
                  <a href="/games.html" class="nav-item">
                    <!-- Gamepad Icon -->
                    <svg
                      class="nav-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <line x1="6" y1="12" x2="10" y2="12"></line>
                      <line x1="8" y1="10" x2="8" y2="14"></line>
                      <circle cx="15" cy="11" r="1"></circle>
                      <circle cx="18" cy="13" r="1"></circle>
                      <path
                        d="M17.8 20a4.1 4.1 0 0 0 2.2-3l1.2-7a6 6 0 0 0-6-7H8.8a6 6 0 0 0-6 7l1.2 7a4.1 4.1 0 0 0 2.2 3 8.5 8.5 0 0 0 11.6 0z"
                      ></path>
                    </svg>
                    Games
                  </a>
                  <div class="drawer-footer">
                    <a class="drawer-brand" href="/index.html"
                      >BRAND<span>NAME</span></a
                    >
                    <a href="about.html">About</a>
                    <a href="privacy.html">Privacy</a>
                    <a href="terms.html">Terms</a>
                    <a href="disclaimer.html">Disclaimer</a>
                    <p>&copy; 2026 BRANDNAME. All rights reserved.</p>
                  </div>
                </nav>
                <button
                  class="menu-backdrop"
                  type="button"
                  aria-label="Close navigation menu"
                  tabindex="-1"
                ></button>

                <!-- Search Bar -->
                <div class="search-box">
                  <input type="text" placeholder="Search for apps and games" />
                  <button type="submit" aria-label="Search">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                  </button>
                </div>
              </header>
            </div>
          </div>
        </div>
      </section>

      <footer>
        <div class="footer-content">
          <a class="footer-brand" href="index.html">BRAND<span>NAME</span></a>
          <nav class="footer-links" aria-label="Footer">
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="disclaimer.html">Disclaimer</a>
          </nav>
          <p class="footer-copyright">
            &copy; 2026 BRANDNAME. All rights reserved.
          </p>
        </div>
      </footer>
    </section>
    <script src="script.js" defer></script>
  </body>
</html>
